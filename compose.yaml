services:
    microsoft-rewards-script:
        # 本地构建本项目代码（V4-china 国内适配版）。
        # ghcr.io/thenetsky/... 是原作者 TheNetsky 的官方镜像，跑的是原版代码，
        # 不含本项目的国内适配（中国热搜 / PushPlus 等）。
        # 仅本地构建用；CI 走 ghcr 拉取，所以放进 profile 默认不启用。
        profiles: ['build']
        build:
            context: .
        image: ghcr.io/${MRS_REGISTRY:-owlshift}/mrs-build:china
        container_name: microsoft-rewards-script
        restart: unless-stopped
        mem_limit: 700m
        memswap_limit: 900m
        ulimits:
            # 禁止 core dump：OOM 时会生成数百 MB 的 core dump 撑爆系统盘
            core: 0
        volumes:
            - ./config:/usr/src/microsoft-rewards-script/config
            - ./sessions:/usr/src/microsoft-rewards-script/sessions
            - ./clawbot1:/usr/src/microsoft-rewards-script/clawbot
        env_file:
            # Load account credentials from the .env file (ACCOUNT_1_EMAIL, optional ACCOUNT_1_PASSWORD, etc.)
            - path: .env
        environment:
            # ── Scheduler ──────────────────────────────────────
            TZ: 'Asia/Shanghai' # Set your timezone for proper scheduling
            NODE_ENV: 'production'
            # V8 老生代上限：需与 mem_limit 配套，留约 220MB 给 Chromium。
            # 物理内存小的设备上，Node 自动算出的默认上限可能只有 ~275MB，
            # 长跑任务会撞上 "Ineffective mark-compacts near heap limit"。
            NODE_OPTIONS: '--max-old-space-size=480 --disable-warning=ExperimentalWarning'
            # CRON_SCHEDULE is the *initial* default. It will run as default unless changed by the API
            # API schedule changes are saved to ./config/schedule.json, delete
            # that file to revert to the base CRON_SCHEDULE again.
            CRON_SCHEDULE: '0 7 * * *' # use crontab.guru to customize your schedule
            RUN_ON_START: 'false' # 首跑改前台交互式，避免后台读 TTY 被 SIGTTIN 挂住
            CONFIG_CLAWBOT_ENABLED: "true"
            CONFIG_CLAWBOT_AUTHFILE: "/usr/src/microsoft-rewards-script/clawbot/clawbot-auth.json"
            SKIP_RANDOM_SLEEP: 'false'
            #MIN_SLEEP_MINUTES: "5"
            #MAX_SLEEP_MINUTES: "50"
            #STUCK_PROCESS_TIMEOUT_HOURS: "8"

            # ── API mode ──────────────────────────────────────
            # Set API_MODE=true to run the API server for additional control options
            #API_MODE: 'true'
            #API_TOKEN: '${API_TOKEN}'             # required for API mode, see example.env
            # API write/reveal capabilities are separate opt-ins and are off by default.
            #API_ALLOW_SCHEDULE_WRITE: 'true'
            #API_ALLOW_ENV_OVERRIDES: 'true'
            #API_ALLOW_CONFIG_REVEAL: 'true'
            #API_ALLOW_CONFIG_WRITE: 'true'

            #  ── Configuration ──────────────────────────────────────
            # Uncomment to override defaults, a full list of configuration options are in the README.
            #CONFIG_CLUSTERS: '1'
            #CONFIG_ACCOUNT_DELAY_MIN: '1min'
            #CONFIG_ACCOUNT_DELAY_MAX: '3min'
            # Continue even if Microsoft reports Fraud_UserWarning_BotScore_UX (not recommended).
            #CONFIG_CONTINTUE_ON_BOT_WARNING: 'false'
            # Block browser image/video/audio requests to reduce transferred media bytes.
            #CONFIG_EXPERIMENTAL_BLOCK_MEDIA: 'false'
            # Report the Edge browsing streak in the background (experimental).
            #CONFIG_EXPERIMENTAL_EDGE_BROWSING: 'false'
            # Only enable for a TLS-intercepting proxy whose certificate cannot be trusted normally.
            #CONFIG_PROXY_IGNORE_CERTIFICATE_ERRORS: 'false'
            #... add additional configuration overrides as needed

            # ── 国内特性（V4-china）──────────────────────────────────
            # 查询源：中国热搜(gmya.net) + 本地词兜底；国内推荐，无需代理
            #CONFIG_SEARCH_QUERY_ENGINES: 'china,local'
            # gmya.net appkey，填入解除免费档限流（留空走免费档，有频率限制）
            #CONFIG_CHINA_API_APPKEY: ''
            # PushPlus 微信推送（国内推荐，无需翻墙）：
            #CONFIG_PUSHPLUS_ENABLED: 'true'
            #CONFIG_PUSHPLUS_TOKEN: 'your_pushplus_token'
            #CONFIG_PUSHPLUS_TITLE: 'Microsoft-Rewards-Script'
            #CONFIG_PUSHPLUS_TEMPLATE: 'txt'        # txt / html / markdown
            #CONFIG_PUSHPLUS_CHANNEL: ''             # 默认微信；可选其他 channel
            # Server酱推送（Turbo 版，SendKey 在 sct.ftqq.com 微信扫码获取）：
            #CONFIG_SERVERCHAN_ENABLED: 'true'
            #CONFIG_SERVERCHAN_SENDKEY: 'SCTxxxxxxxxxxxxxxxx'
            #CONFIG_SERVERCHAN_TITLE: 'Microsoft-Rewards-Script'
            # 微信 ClawBot 推送（官方 iLink 直连，免费；需容器内完成一次扫码，
            # 建议配合 API_MODE/tty 使用，或本地登录后把 clawbot-auth.json 挂载进容器）：
            #CONFIG_CLAWBOT_ENABLED: 'true'
            #CONFIG_CLAWBOT_AUTHFILE: ''             # 凭证路径，默认项目根 clawbot-auth.json

        # ── API mode port mapping ──────────────────────────────────────
        # Uncomment when API_MODE=true
        #ports:
        #    - '3010:3010'

        healthcheck:
            test: ['CMD-SHELL', 'scripts/docker/healthcheck.sh']
            interval: 60s
            timeout: 5s
            retries: 3
            start_period: 30s

        security_opt:
            - no-new-privileges:true

    microsoft-rewards-script-2:
        image: ghcr.io/${MRS_REGISTRY:-owlshift}/mrs-build:china
        container_name: microsoft-rewards-script-2
        restart: unless-stopped
        mem_limit: 700m
        memswap_limit: 900m
        ulimits:
            # 禁止 core dump：OOM 时会生成数百 MB 的 core dump 撑爆系统盘
            core: 0
        volumes:
            - ./config2:/usr/src/microsoft-rewards-script/config
            - ./sessions2:/usr/src/microsoft-rewards-script/sessions
            - ./clawbot2:/usr/src/microsoft-rewards-script/clawbot
        env_file:
            - path: .env2
        environment:
            TZ: "Asia/Shanghai"
            NODE_ENV: "production"
            # V8 老生代上限：见 microsoft-rewards-script 服务的说明
            NODE_OPTIONS: '--max-old-space-size=480 --disable-warning=ExperimentalWarning'
            CRON_SCHEDULE: "0 14 * * *"
            RUN_ON_START: "false"
            # 卡死进程超时：默认 8h 会让早档任务活过下一档的触发时间，
            # 届时两个容器各 700m 直接撞车 OOMKill。压到 4h。
            STUCK_PROCESS_TIMEOUT_HOURS: "4"
            CONFIG_CLAWBOT_ENABLED: "true"
            CONFIG_CLAWBOT_AUTHFILE: "/usr/src/microsoft-rewards-script/clawbot/clawbot-auth.json"
        healthcheck:
            test: ["CMD-SHELL", "scripts/docker/healthcheck.sh"]
            interval: 60s
            timeout: 5s
            retries: 3
            start_period: 30s
        security_opt:
            - no-new-privileges:true
