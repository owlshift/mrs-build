name: Build image

# 手动触发，或 Dockerfile/compose/Dockerfile 相关文件变化时触发。
# 不做定时构建：镜像只在需要时重建，armbian 侧 pull 即可。
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'src/**'
      - 'scripts/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    # qemu 跨编 arm64 的 Chromium 大镜像很慢，给足时间
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # 目标是 armbian(aarch64)，amd64 镜像在盒子上跑不起来
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            APT_MIRROR=${{ vars.APT_MIRROR || '' }}
            NPM_REGISTRY=${{ vars.NPM_REGISTRY || '' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:china
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          # armbian 板子内存只有 785MiB，本地 build 会耗尽磁盘。
          # Actions runner 有 14GB，build cache 放这里，armbian 只 pull。
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
