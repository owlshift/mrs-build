name: Build image

# 手动触发，或 Dockerfile/compose/Dockerfile 相关文件变化时触发。
# 不做定时构建：镜像只在需要时重建，部署机侧 pull 即可。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'src/**'
      - 'scripts/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # 多阶段 + 多架构，需要 buildx（runner 自带的 docker build 不支持）
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 部署机是 aarch64，必须出 arm64；amd64 留着方便本地/CI 验证。
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          build-args: |
            APT_MIRROR=${{ vars.APT_MIRROR || '' }}
            NPM_REGISTRY=${{ vars.NPM_REGISTRY || '' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:china
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          # 部署机磁盘通常吃紧，本地 build 会耗尽空间。
          # Actions runner 有充足临时盘，build cache 放这里，部署机只 pull。
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
